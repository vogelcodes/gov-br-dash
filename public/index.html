<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gov-br-dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 480px; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #f8fafc; }
    p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #f8fafc; font-size: 0.95rem; margin-bottom: 0.75rem; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; padding: 0.6rem; background: #3b82f6; color: #fff; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #2563eb; }
    button:disabled { background: #1e40af; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid #334155; color: #94a3b8; }
    .btn-ghost:hover { background: #1e293b; color: #e2e8f0; }
    .error { background: #7f1d1d; border: 1px solid #b91c1c; border-radius: 4px; padding: 0.6rem; margin-bottom: 0.75rem; font-size: 0.85rem; color: #fca5a5; display: none; }
    .success { background: #14532d; border: 1px solid #16a34a; border-radius: 4px; padding: 0.6rem; margin-bottom: 0.75rem; font-size: 0.85rem; color: #86efac; display: none; }
    .uasg-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem; background: #0f172a; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .uasg-item .codigo { color: #3b82f6; font-weight: 600; }
    .uasg-item .nome { color: #94a3b8; }
    .uasg-item button { width: auto; padding: 0.25rem 0.75rem; margin: 0; font-size: 0.8rem; background: #7f1d1d; }
    .hidden { display: none !important; }
    .section-title { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .user-bar span { font-size: 0.9rem; color: #94a3b8; }
    .loading { opacity: 0.6; pointer-events: none; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Auth: Login / Signup -->
    <div id="auth-view">
      <h1>gov-br-dash</h1>
      <p>Dados públicos do governo federal</p>
      <div class="card">
        <div id="auth-error" class="error"></div>
        <div id="auth-success" class="success"></div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="mínimo 12 caracteres" />
        <button id="btn-login">Entrar</button>
        <button id="btn-signup" class="btn-ghost">Criar conta</button>
      </div>
    </div>

    <!-- Dashboard: UASG management -->
    <div id="dashboard-view" class="hidden">
      <div class="user-bar">
        <span id="user-email"></span>
        <button id="btn-logout" class="btn-ghost" style="width:auto;padding:0.35rem 0.75rem;font-size:0.8rem;">Sair</button>
      </div>
      <h1>Minhas UASGs</h1>
      <p>Cadastre até 3 UASGs para acompanhar atas de registro de preços</p>

      <div class="card">
        <div id="uasg-add-error" class="error"></div>
        <label for="uasg-input">Código UASG</label>
        <input type="text" id="uasg-input" placeholder="ex: 160292" maxlength="6" />
        <button id="btn-add-uasg">Adicionar UASG</button>
      </div>

      <div id="uasg-list"></div>
      <div id="uasg-empty" class="card hidden">
        <p style="text-align:center;color:#64748b;margin:0;">Nenhuma UASG cadastrada</p>
      </div>
    </div>

  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const api = (method, path, body) => {
      const opts = { method, headers: { "Content-Type": "application/json" }, credentials: "include" };
      if (body) opts.body = JSON.stringify(body);
      return fetch(path, opts).then(async (r) => ({ ok: r.ok, status: r.status, body: await r.json() }));
    };

    let user = null;

    async function checkSession() {
      const r = await api("GET", "/api/auth/me");
      if (r.ok) { user = r.body.user; showDashboard(); }
      else { showAuth(); }
    }

    function showAuth() {
      $("#auth-view").classList.remove("hidden");
      $("#dashboard-view").classList.add("hidden");
      $("#auth-error").style.display = "none";
      $("#auth-success").style.display = "none";
    }

    function showDashboard() {
      $("#auth-view").classList.add("hidden");
      $("#dashboard-view").classList.remove("hidden");
      $("#user-email").textContent = user.email;
      loadUasgs();
    }

    function setLoading(btn, on) {
      if (on) {
        btn.dataset.label = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span>aguarde';
        btn.disabled = true;
      } else {
        btn.textContent = btn.dataset.label || "";
        btn.disabled = false;
      }
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.style.display = "block";
    }

    function clearMsgs() {
      $("#auth-error").style.display = "none";
      $("#auth-success").style.display = "none";
      $("#uasg-add-error").style.display = "none";
    }

    async function doLogin() {
      clearMsgs();
      const btn = $("#btn-login");
      const email = $("#email").value.trim();
      const password = $("#password").value;
      if (!email || !password) { showError($("#auth-error"), "Preencha email e senha."); return; }
      setLoading(btn, true);
      const r = await api("POST", "/api/auth/login", { email, password });
      setLoading(btn, false);
      if (r.ok) { user = r.body.user; showDashboard(); }
      else { showError($("#auth-error"), r.body.message || "Login falhou."); }
    }

    async function doSignup() {
      clearMsgs();
      const btn = $("#btn-signup");
      const email = $("#email").value.trim();
      const password = $("#password").value;
      if (!email || !password) { showError($("#auth-error"), "Preencha email e senha."); return; }
      if (password.length < 12) { showError($("#auth-error"), "Senha precisa de no mínimo 12 caracteres."); return; }
      setLoading(btn, true);
      const r = await api("POST", "/api/auth/signup", { email, password });
      setLoading(btn, false);
      if (r.ok) {
        $("#auth-success").textContent = "Conta criada! Faça login.";
        $("#auth-success").style.display = "block";
        doLogin();
      } else { showError($("#auth-error"), r.body.message || "Cadastro falhou."); }
    }

    async function loadUasgs() {
      const r = await api("GET", "/api/me/uasgs");
      const list = $("#uasg-list");
      const empty = $("#uasg-empty");
      if (!r.ok) { list.innerHTML = ""; empty.classList.remove("hidden"); return; }
      const uasgs = r.body.uasgs || [];
      if (uasgs.length === 0) { list.innerHTML = ""; empty.classList.remove("hidden"); return; }
      empty.classList.add("hidden");
      list.innerHTML = uasgs.map((u) => `
        <div class="uasg-item">
          <div><span class="codigo">${u.codigoUasg}</span> <span class="nome">${u.nomeUasg || ""}</span></div>
          <button onclick="removeUasg('${u.codigoUasg}')">×</button>
        </div>`).join("");
    }

    async function addUasg() {
      clearMsgs();
      const codigoUasg = $("#uasg-input").value.trim();
      if (!codigoUasg) { showError($("#uasg-add-error"), "Informe o código da UASG."); return; }
      const btn = $("#btn-add-uasg");
      setLoading(btn, true);
      const r = await api("POST", "/api/me/uasgs", { codigoUasg });
      setLoading(btn, false);
      if (r.ok) { $("#uasg-input").value = ""; loadUasgs(); }
      else { showError($("#uasg-add-error"), r.body.message || "Erro ao adicionar UASG."); }
    }

    async function removeUasg(codigoUasg) {
      const r = await api("DELETE", `/api/me/uasgs/${codigoUasg}`);
      if (r.ok) loadUasgs();
    }

    async function doLogout() {
      await api("POST", "/api/auth/logout");
      user = null;
      showAuth();
    }

    $("#btn-login").addEventListener("click", doLogin);
    $("#btn-signup").addEventListener("click", doSignup);
    $("#btn-logout").addEventListener("click", doLogout);
    $("#btn-add-uasg").addEventListener("click", addUasg);
    $("#password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    $("#uasg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") addUasg(); });

    checkSession();
  </script>
</body>
</html>
